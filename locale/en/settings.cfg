personal-equip-em-plant=All personal equipment in EM plant
logi-in-em-plant=Logistic chests in EM plant
inserters-in-em-plant=Inserters in EM plant
experimental-compat=Experimental compatibility mode

[mod-setting-description]
adv-science-recipes=Whether or not to enable recipes for basic science packs that require more advanced ingredients for a better output.
basic-science-changes=Whether or not to enable some science packs to be able to be produced in more buildings. Disable this if the mod is overriding other mods' recipe changes.
nuclear-reactor-cryo-plant=Whether or not to allow crafting of nuclear reactors in the cryo plant.
personal-equip-em-plant=Whether or not to add all personal equipment not already in it to the EM plant. If nuclear reactor in cryo plant is enabled, will also enable personal nuclear and fusion reactors in the cryo plant.
logi-in-em-plant=Whether or not to enable crafting of logistic chests in the EM plant.
inserters-in-em-plant=Whether or not to enable crafting of inserters in the EM plant. Disabled by default due to design philosophy.
experimental-compat=Currently only affects assemblers and chemical plants. Attempts to automatically find and assign categories to modded machines as necessary, but may add recipes to the wrong machines or miss some others. If this is a significant issue, turn this option off. EP is primarily focused around vanilla and does not fully support most mods.